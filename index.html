<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>WoT Flashcards</title>
<meta name="theme-color" content="#1e2618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WoT Cards">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-32.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="header-top">
    <h1>WoT Flashcards</h1>
    <div class="progress" id="progress">0 / 0</div>
  </div>
  <nav class="deck-tabs" id="deckTabs"></nav>
</header>

<main class="card-stage">
  <div class="card" id="card">
    <div class="card-face card-front" id="cardFront"></div>
    <div class="card-face card-back" id="cardBack"></div>
  </div>
</main>

<footer class="controls">
  <button id="btnPrev" class="ctrl-btn" aria-label="Előző kártya">‹</button>
  <button id="btnFlip" class="ctrl-btn ctrl-flip" aria-label="Kártya fordítása">⟳</button>
  <button id="btnNext" class="ctrl-btn" aria-label="Következő kártya">›</button>
  <button id="btnShuffle" class="ctrl-btn ctrl-small" aria-label="Keverés">⤨</button>
</footer>

<script src="js/tanks-data.js"></script>
<script src="js/armor-zones.js"></script>
<script src="js/app.js"></script>
</body>
</html>
